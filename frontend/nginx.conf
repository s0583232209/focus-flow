server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # A types block replaces the whole MIME map where it appears, so it stays
    # inside these two locations and the rest keeps the default map.
    location ~ \.wasm$ {
        types { application/wasm wasm; }
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ~ \.mjs$ {
        types { text/javascript mjs; }
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Vite puts a hash in these file names, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Written at container start from API_URL: must never be cached.
    location = /config.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # React Router owns every other path: a refresh on /library must get index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
