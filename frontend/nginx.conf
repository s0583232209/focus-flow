# הגדרות שרת ה-nginx שמגיש את האתר הבנוי בתוך הקונטיינר.
server {
    # מאזינים בפורט 3000 (גם מקומית וגם ב-Cloud Run)
    listen 3000;
    # התיקייה שממנה מגישים קבצים
    root /usr/share/nginx/html;
    # הקובץ שמוגש כשמבקשים תיקייה
    index index.html;

    # בלוק types מחליף את כל מפת סוגי הקבצים (MIME) במקום שבו הוא מופיע, ולכן הוא נשאר
    # רק בתוך שני ה-location האלה, ושאר הקבצים מקבלים את המפה הרגילה.
    # ~ = התאמה לפי ביטוי רגולרי; \.wasm$ = קבצים שמסתיימים ב-.wasm
    location ~ \.wasm$ {
        # בלי הסוג application/wasm הדפדפן מסרב לטעון את המודל
        types { application/wasm wasm; }
        # שמירה במטמון הדפדפן ליום אחד (86400 שניות)
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # מודולי JavaScript (.mjs) של onnxruntime
    location ~ \.mjs$ {
        types { text/javascript mjs; }
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Vite מוסיף לשמות הקבצים כאן hash של התוכן, ולכן אפשר לשמור אותם במטמון לשנה
    # (קובץ שהשתנה מקבל שם חדש)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # נכתב בהפעלת הקונטיינר לפי API_URL – אסור שיישמר במטמון
    # = פירושו התאמה מדויקת לנתיב
    location = /config.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # דף הבית – תמיד לבדוק גרסה חדשה, כדי שעדכון באתר יגיע מיד
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # React Router אחראי על כל שאר הנתיבים: רענון ב-/library חייב לקבל את index.html.
    # try_files: אם יש קובץ בשם הזה – מגישים אותו; אחרת – index.html (ואז React מציג את הדף הנכון)
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
