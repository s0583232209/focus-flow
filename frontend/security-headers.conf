# nginx drops inherited add_header lines in any location that has its own add_header,
# so every location includes this file.
add_header X-Content-Type-Options "nosniff" always;
# YouTube embeds fail with Error 153 when no Referer is sent, so not "no-referrer".
# Other sites get only the origin, never the path.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self)" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.youtube.com https://s.ytimg.com; connect-src 'self' http://localhost:8000 blob:; img-src 'self' data: blob: https://img.youtube.com https://i.ytimg.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com; media-src 'self' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'" always;
