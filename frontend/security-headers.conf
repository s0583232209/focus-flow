# כותרות אבטחה שנשלחות עם כל תגובה.
# nginx מתעלם משורות add_header שעוברות בירושה בכל location שיש לו add_header משלו,
# ולכן כל location כולל את הקובץ הזה במפורש. always = גם בתגובות שגיאה.

# הדפדפן לא "ינחש" סוג קובץ אחר מזה שהשרת הצהיר (מונע הרצת קובץ טקסט כסקריפט)
add_header X-Content-Type-Options "nosniff" always;
# הטמעות YouTube נכשלות עם Error 153 כשלא נשלח Referer, ולכן לא "no-referrer".
# אתרים אחרים מקבלים רק את הדומיין, אף פעם לא את הנתיב המלא
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# המצלמה מותרת רק לאתר שלנו עצמו (לא ל-iframe של אתר אחר)
add_header Permissions-Policy "camera=(self)" always;
# Content-Security-Policy: רשימה לבנה של מקורות מותרים לכל סוג משאב. כל השאר נחסם – הגנה חזקה מפני XSS.
# script-src: סקריפטים רק מהאתר שלנו ומ-YouTube; 'wasm-unsafe-eval' נחוץ להרצת WebAssembly (המודל)
# connect-src: לאן מותר לשלוח בקשות (השרת שלנו); img-src: תמונות ממוזערות של YouTube
# frame-src: iframe רק של YouTube; media-src/worker-src: blob נחוץ למצלמה ול-MediaPipe
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.youtube.com https://s.ytimg.com; connect-src 'self' http://localhost:8000 blob:; img-src 'self' data: blob: https://img.youtube.com https://i.ytimg.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com; media-src 'self' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'" always;
